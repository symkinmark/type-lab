<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type Lab — Specimen Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,440&family=Albert+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js" defer></script>
<style>
  :root{
    --paper:#fdfaf3;--ink:#0e0e0e;--ink-soft:#3a3a36;--line:#e8e3d6;--line-strong:#c8c2b1;
    --accent:#0e0e0e;--black:#0e0e0e;--paper-on-black:#fdfaf3;--micro:#8e8a7e;
    --size:46px;
    --ui:'Albert Sans',-apple-system,system-ui,sans-serif;
    --mono:'Spline Sans Mono',ui-monospace,monospace;--display:'Fraunces',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{text-rendering:optimizeLegibility}
  body{background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.4}
  header{position:sticky;top:0;z-index:50;background:rgba(253,250,243,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-strong)}
  .masthead{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:.85rem 1.6rem .7rem;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:.7rem}
  .brand h1{font-family:var(--display);font-weight:440;font-style:italic;font-size:3rem;letter-spacing:-.025em;line-height:.95}
  .brand .tick{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:.2rem .4rem}
  .brand .sub{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
  .count{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
  .controls{border-top:1px solid var(--line);padding:.7rem 1.6rem .9rem;display:grid;gap:.6rem}
  .row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-right:.15rem;white-space:nowrap}
  .pill{font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line-strong);background:transparent;color:var(--ink-soft);padding:.36rem .68rem;border-radius:999px;cursor:pointer;transition:background .18s ease,border-color .18s ease,color .18s ease,transform .08s ease;user-select:none;will-change:transform}
  .pill:hover{border-color:var(--ink);color:var(--ink)}
  .pill:active{transform:scale(.96)}
  .pill.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .pill.on.accent{background:var(--accent);border-color:var(--accent)}
  .pill.fav.on{background:var(--ink);border-color:var(--ink)}
  input[type=text]{font-family:var(--ui);font-size:.92rem;color:var(--ink);background:#fff;border:1px solid var(--line-strong);padding:.5rem .7rem;border-radius:4px;outline:none;transition:.15s}
  input[type=text]:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,.12)}
  input.search{flex:1;min-width:150px;max-width:260px}
  input.phrase{flex:1;min-width:200px}
  input.word{width:140px}
  ::placeholder{color:#aaa}
  .slider-wrap{display:flex;align-items:center;gap:.55rem;min-width:190px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:2px;background:var(--line-strong);border-radius:2px;cursor:pointer;flex:1}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--ink)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:2px solid var(--paper);border-radius:50%;background:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .val{font-family:var(--mono);font-size:.66rem;color:var(--ink-soft);width:46px;text-align:right}
  .upload-btn{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;border:1px dashed var(--line-strong);background:transparent;color:var(--ink-soft);padding:.45rem .8rem;border-radius:4px;cursor:pointer;transition:.15s}
  .upload-btn:hover{border-color:var(--ink);color:var(--ink);border-style:solid}
  main{padding:0 1.6rem 6rem}
  /* generous breathing room between fonts */
  .card{border-bottom:1px solid var(--line);padding:7rem 0 7.5rem;font-synthesis:none;transition:opacity .18s ease}
  .card.refreshing{opacity:.4}
  .card.isfav{background:linear-gradient(90deg,rgba(0,0,0,.045),transparent 40%);margin:0 -1.6rem;padding-left:1.6rem;padding-right:1.6rem;border-left:2px solid var(--ink)}
  .card-head{display:flex;flex-direction:column;gap:1.2rem;margin-bottom:3rem}
  .ch-top{display:flex;align-items:baseline;gap:.8rem}
  .ch-bot{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  .actions{display:flex;gap:.3rem;margin-left:auto;flex-wrap:wrap}
  @media(hover:hover){.card .actions{opacity:0;transition:opacity .18s} .card:hover .actions, .card:focus-within .actions{opacity:1}}
  .star{font-size:1.4rem;line-height:1;background:none;border:none;cursor:pointer;color:var(--line-strong);transition:.15s;padding:0 .1rem;flex-shrink:0}
  .star:hover{color:var(--ink);transform:scale(1.15)}
  .star.on{color:var(--ink)}
  .fname{font-family:var(--display);font-weight:440;font-size:2.2rem;letter-spacing:-.015em;line-height:1.05;flex:1;min-width:0;word-break:break-word}
  .meta{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
  .tag{font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--line-strong);border-radius:2px;padding:.16rem .4rem}
  .tag.cat{color:var(--ink)}
  .tag.up{color:var(--ink);border-color:var(--ink)}
  .tag.one{color:var(--ink);border-color:var(--ink);border-style:dashed}
  .lic{display:flex;align-items:center;gap:.35rem}
  .lic-sel{font-family:var(--mono);font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-strong);border-radius:2px;padding:.18rem .3rem;background:#fff;color:var(--ink);cursor:pointer}
  .lic-dot{width:8px;height:8px;border-radius:50%;display:inline-block;border:1px solid var(--ink)}
  .price-inp{width:78px;font-family:var(--mono);font-size:.6rem;padding:.2rem .35rem !important;border-radius:2px !important}
  .lic-search{font-family:var(--mono);font-size:.62rem;color:var(--ink-soft);text-decoration:none;border:1px solid var(--line-strong);border-radius:2px;padding:.16rem .34rem}
  .lic-search:hover{color:var(--ink);border-color:var(--ink)}
  .act{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-strong);background:transparent;color:var(--ink-soft);border-radius:3px;padding:.22rem .5rem;cursor:pointer;transition:background .18s ease,border-color .18s ease,color .18s ease,transform .08s ease;will-change:transform}
  .act:hover{border-color:var(--ink);color:var(--ink)}
  .act:active{transform:scale(.95)}
  .idx{font-family:var(--mono);font-size:.6rem;color:var(--micro);letter-spacing:.1em;margin-left:auto;flex-shrink:0}
  /* per-card inline tester */
  .big[contenteditable]{outline:none;cursor:text;border-bottom:1px dashed transparent;transition:border-color .15s}
  .big[contenteditable]:hover{border-bottom-color:var(--line-strong)}
  .big[contenteditable]:focus{border-bottom-color:var(--ink)}
  .para[contenteditable]{outline:none;cursor:text}
  .para[contenteditable]:focus{box-shadow:inset 0 -1px 0 var(--ink)}
  .weights{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;margin-bottom:2.8rem}
  .wchip{font-family:var(--mono);font-size:.68rem;border:1px solid var(--line-strong);color:var(--ink-soft);background:transparent;border-radius:999px;padding:.34rem .78rem;cursor:pointer;transition:background .18s ease,border-color .18s ease,color .18s ease,transform .08s ease;will-change:transform}
  .wchip:hover{border-color:var(--ink);color:var(--ink)}
  .wchip:active{transform:scale(.94)}
  .wchip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .wchip.ital{font-style:italic}
  /* specimens — lots of vertical space */
  .spec{margin:0 0 3.5rem;font-synthesis:none}
  .spec:last-child{margin-bottom:0}
  .spec .tiny{font-family:var(--mono);font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--micro);margin-bottom:1rem;display:block}
  .big{line-height:1.25;letter-spacing:-.005em;word-break:break-word;color:var(--ink);min-height:1.25em;font-size:var(--size);font-size-adjust:ex-height 0.5;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  .big + .big{margin-top:.7rem}
  .para{line-height:1.7;color:var(--ink);max-width:62ch;font-size:max(15px,calc(var(--size) * 0.4));font-size-adjust:ex-height 0.5;-webkit-font-smoothing:antialiased}
  /* smooth list swaps for filter changes */
  #list{transition:opacity .16s ease}
  #list.swapping{opacity:0}
  /* surgical specs container — local fade on weight/italic toggle */
  .specs-wrap{transition:opacity .14s ease}
  .specs-wrap.swapping{opacity:.35}
  .words{display:flex;gap:4rem;flex-wrap:wrap;align-items:baseline}
  .words .unit{display:flex;flex-direction:column;gap:.3rem}
  .blackstrip{background:var(--black);color:var(--paper-on-black);border-radius:6px;padding:1.6rem 1.6rem}
  .blackstrip .tiny{color:#888}.blackstrip .big{color:var(--paper-on-black)}
  .rtl{direction:rtl;text-align:right}
  .empty{padding:5rem 1rem;text-align:center;color:var(--ink-soft);font-family:var(--mono);font-size:.8rem;letter-spacing:.06em;line-height:2}
  #sentinel{height:40px}
  .loading-note{font-family:var(--mono);font-size:.6rem;color:var(--micro);text-transform:uppercase;letter-spacing:.12em;padding:1.5rem 0;text-align:center}
  /* board popover */
  #pop{position:fixed;z-index:300;display:none;background:#fff;border:1px solid var(--ink);border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.18);padding:.8rem;min-width:220px;max-height:60vh;overflow:auto}
  #pop h4{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.6rem}
  .bopt{display:flex;align-items:center;gap:.5rem;padding:.32rem .25rem;cursor:pointer;font-size:.85rem;border-radius:4px}
  .bopt:hover{background:#f2f2f2}
  .bopt input{accent-color:#000}
  .newrow{display:flex;gap:.4rem;margin-top:.6rem;border-top:1px solid var(--line);padding-top:.6rem}
  .newrow input{flex:1;font-size:.8rem;padding:.35rem .5rem}
  .newrow button{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:0 .7rem;cursor:pointer}
  .drop-hint{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.93);backdrop-filter:blur(4px);font-family:var(--display);font-style:italic;font-size:2rem;color:var(--ink);border:3px dashed var(--ink)}
  body.dragging .drop-hint{display:flex}
  footer{padding:1.4rem 1.6rem 3rem;border-top:1px solid var(--line);font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;color:var(--micro);text-transform:uppercase;line-height:1.9}
  .act.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .insight{margin-top:1.5rem;border-top:1px dashed var(--line-strong);padding-top:1.2rem;display:none}
  .insight.show{display:block}
  .ins-grid{display:flex;gap:1.8rem;flex-wrap:wrap;margin-bottom:1.1rem}
  .ins-metric{font-family:var(--mono);font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--micro)}
  .ins-metric b{display:block;font-family:var(--display);font-weight:440;font-size:1.3rem;color:var(--ink);letter-spacing:0;text-transform:none;margin-top:.2rem}
  .ins-feats{list-style:none;display:flex;flex-direction:column;gap:.55rem;max-width:70ch}
  .ins-feats li{font-size:.95rem;line-height:1.45;padding-left:1.1rem;position:relative;color:var(--ink)}
  .ins-feats li::before{content:'▍';position:absolute;left:0;color:var(--ink)}
  .ins-feats li i{font-style:normal;font-family:var(--mono);font-size:.78rem;color:var(--ink-soft)}
  .ins-busy{font-family:var(--mono);font-size:.65rem;color:var(--micro);text-transform:uppercase;letter-spacing:.1em}
  #cmpbar{position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%);z-index:120;background:var(--ink);color:#fff;border-radius:999px;padding:.5rem .6rem .5rem 1.1rem;display:none;align-items:center;gap:.7rem;box-shadow:0 14px 40px rgba(0,0,0,.28)}
  #cmpbar.show{display:flex}
  #cmpbar .ctxt{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase}
  #cmpbar button{font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:.42rem .85rem;cursor:pointer;border:1px solid #fff;background:#fff;color:#000}
  #cmpbar button.ghost{background:transparent;color:#fff}
  #cmpbar button:disabled{opacity:.4;cursor:not-allowed}
  #cmpview{position:fixed;inset:0;z-index:250;background:#fff;display:none;flex-direction:column}
  #cmpview.show{display:flex}
  .cmp-top{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.4rem;border-bottom:1px solid var(--line-strong)}
  .cmp-top h3{font-family:var(--display);font-style:italic;font-weight:440;font-size:1.4rem}
  .cmp-cols{flex:1;overflow:auto;display:grid}
  .cmp-col{border-right:1px solid var(--line);padding:1.6rem 1.4rem;overflow:auto;min-width:0}
  .cmp-col:last-child{border-right:none}
  .cmp-col .cn{font-family:var(--display);font-size:1.05rem;margin-bottom:1.2rem;padding-bottom:.6rem;border-bottom:1px solid var(--line)}
  .cmp-col .tiny{font-family:var(--mono);font-size:.5rem;letter-spacing:.16em;text-transform:uppercase;color:var(--micro);display:block;margin:.3rem 0 .45rem}
  .cmp-col .big{color:var(--ink);line-height:1.3;word-break:break-word;margin-bottom:1.4rem}
  .cmp-close{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:.45rem 1.1rem;cursor:pointer}
  .gear{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-strong);background:transparent;color:var(--ink-soft);border-radius:999px;padding:.3rem .7rem;cursor:pointer}
  .gear:hover{border-color:var(--ink);color:var(--ink)}
  .gear.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  #syncview{position:fixed;inset:0;z-index:260;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:1rem}
  #syncview.show{display:flex}
  .sync-card{background:#fff;border:1px solid var(--ink);border-radius:10px;max-width:470px;width:100%;padding:1.4rem 1.5rem 1.3rem;box-shadow:0 24px 70px rgba(0,0,0,.3)}
  .sync-card h3{font-family:var(--display);font-style:italic;font-weight:440;font-size:1.45rem;margin-bottom:.1rem}
  .sync-card p.note{font-size:.82rem;color:var(--ink-soft);line-height:1.55;margin:.5rem 0 .4rem}
  .sync-card a{color:var(--ink)}
  .sync-card label{display:block;font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:.8rem 0 .25rem}
  .sync-card select,.sync-card input{width:100%;font-family:var(--ui);font-size:.85rem;border:1px solid var(--line-strong);border-radius:5px;padding:.45rem .6rem;background:#fff;color:var(--ink);outline:none}
  .sync-card input:focus,.sync-card select:focus{border-color:var(--ink)}
  .sync-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
  .sync-row button{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);border-radius:6px;padding:.5rem .9rem;cursor:pointer;background:#fff;color:#000}
  .sync-row button.solid{background:#000;color:#fff}
  .sync-status{font-family:var(--mono);font-size:.62rem;color:var(--ink-soft);margin-top:.9rem;min-height:1em}
  .sync-close{float:right;border:none;background:none;font-size:1.1rem;cursor:pointer;color:var(--ink-soft);line-height:1}
  @media(max-width:640px){.masthead{padding:.7rem 1rem .55rem}.controls{padding:.6rem 1rem .8rem}main{padding:0 1rem 5rem}.card.isfav{margin:0 -1rem;padding-left:1rem;padding-right:1rem}.words{gap:1.5rem}}
</style>
</head>
<body>
<div class="drop-hint">drop font files to load</div>
<div id="pop"></div>
<div id="cmpbar"></div>
<div id="cmpview"></div>
<div id="syncview"></div>
<header>
  <div class="masthead">
    <div class="brand"><h1>Type&nbsp;Lab</h1><span class="tick">specimen</span><span class="sub" id="catnote">Google Fonts + Fontshare + Libre foundries + your uploads</span></div>
    <div style="display:flex;align-items:center;gap:.7rem"><button class="gear" id="syncbtn">⚙ sync</button><div class="count" id="count">—</div></div>
  </div>
  <div class="controls">
    <div class="row" id="shelf">
      <span class="lbl">View</span>
      <button class="pill on" data-view="library">Library</button>
      <button class="pill" data-view="archive" id="archpill">Archive</button>
      <span class="lbl" style="margin-left:.5rem">Boards</span>
      <span id="boardpills" style="display:flex;gap:.5rem;flex-wrap:wrap"></span>
      <button class="pill" id="newboard">＋ new board</button>
    </div>
    <div class="row">
      <span class="lbl">Script</span>
      <button class="pill on" data-lang="all">All / Latin</button>
      <button class="pill" data-lang="uk">Ukrainian</button>
      <button class="pill" data-lang="he">Hebrew</button>
      <button class="pill" data-lang="pt">Portuguese</button>
      <button class="pill" data-lang="de">German</button>
      <button class="pill fav" id="favonly">★ Favourites</button>
      <button class="pill" id="randompill" title="Shuffle font order">🎲 Random</button>
      <input type="text" class="search" id="search" placeholder="search fonts…">
    </div>
    <div class="row">
      <span class="lbl">Type</span>
      <button class="pill on" data-cat="all">All</button>
      <button class="pill" data-cat="sans">Sans</button>
      <button class="pill" data-cat="serif">Serif</button>
      <button class="pill" data-cat="display">Display</button>
      <button class="pill" data-cat="handwriting">Script</button>
      <button class="pill" data-cat="mono">Mono</button>
      <span class="lbl" style="margin-left:.4rem">Source</span>
      <button class="pill on" data-src="all">All</button>
      <button class="pill" data-src="google">Google</button>
      <button class="pill" data-src="fontshare">Fontshare</button>
      <button class="pill" data-src="libre">Libre</button>
      <button class="pill" data-src="uploaded">Uploaded</button>
      <span class="lbl" style="margin-left:.4rem">License</span>
      <button class="pill on" data-lic="all">All</button>
      <button class="pill" data-lic="free">Free</button>
      <button class="pill" data-lic="rent">Rent</button>
      <button class="pill" data-lic="paid">Paid once</button>
    </div>
    <div class="row">
      <span class="lbl">Your words</span>
      <input type="text" class="phrase" id="phrase" placeholder="type a phrase…">
      <span class="lbl">One word</span>
      <input type="text" class="word" id="word" placeholder="word">
    </div>
    <div class="row">
      <span class="lbl">Size</span>
      <div class="slider-wrap"><input type="range" id="size" min="14" max="120" value="46"><span class="val" id="sizeval">46px</span></div>
      <span class="lbl" style="margin-left:.4rem">Show</span>
      <button class="pill on" data-spec="phrase">Phrase</button>
      <button class="pill on" data-spec="caps">Caps</button>
      <button class="pill on" data-spec="para">Paragraph</button>
      <button class="pill on" data-spec="single">Words</button>
      <button class="pill on" data-spec="black">Black</button>
      <button class="upload-btn" id="uploadbtn">+ Upload or drag fonts anywhere</button>
      <input type="file" id="fileinput" accept=".ttf,.otf,.woff,.woff2" multiple hidden>
    </div>
  </div>
</header>
<main id="list"></main>
<div id="sentinel"></div>

/* index by name */
const byName={}; GF.forEach(f=>byName[f.f]=f); FS.forEach(f=>byName[f.f]=f); LF.forEach(f=>byName[f.f]=f);

/* ---------- lazy font loading ---------- */
const loaded=new Set();
function famOf(f){return f.up?f.fam:f.f;}
function ensureFace(f,w,it){
  if(f.up)return;                         // uploaded faces already registered
  const key=f.f+'|'+w+'|'+(it?1:0); if(loaded.has(key))return; loaded.add(key);
  if(f.src==='lf'){
    // Libre Fonts — inject @font-face pointing to jsDelivr (no CSS API, we build the rule)
    const filename=f.files&&f.files[String(w)];
    if(!filename)return;
    const css="@font-face{font-family:'"+f.f.replace(/'/g,"\\'")+"';src:url('"+f.cdn+filename+"') format('woff2');font-weight:"+w+";font-style:normal;font-display:swap}";
    const s=document.createElement('style');s.textContent=css;document.head.appendChild(s);
    return;
  }
  const l=document.createElement('link');l.rel='stylesheet';
  if(f.src==='fs'){
    // Fontshare CSS API — italic not supported via simple endpoint, fall back to regular
    l.href='https://api.fontshare.com/v2/css?f[]='+f.slug+'@'+w+'&display=swap';
  } else {
    const spec=it?('ital,wght@1,'+w):('wght@'+w);
    l.href='https://fonts.googleapis.com/css2?family='+f.f.replace(/ /g,'+')+':'+spec+'&display=swap';
  }
  document.head.appendChild(l);
}
function loadCardFaces(f){
  selWeights(f).forEach(w=>{ensureFace(f,w,false); if(italOn[f.f])ensureFace(f,w,true);});
}

/* ---------- helpers ---------- */
const esc=s=>(''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const aPhrase=()=>state.phrase.trim()||LANGS[state.lang].phrase;
const aWord=()=>state.word.trim()||LANGS[state.lang].word;
const aPara=()=>LANGS[state.lang].para;
const isFav=n=>favorites.includes(n);
function selWeights(f){
  if(!selW[f.f]){const w=f.w;const s=[];s.push(w.includes(400)?400:w[0]);if(w.includes(700)&&!s.includes(700))s.push(700);selW[f.f]=s;}
  return [...selW[f.f]].sort((a,b)=>a-b);
}
function getLic(f){const d={type:f.up?'unknown':'free',price:''};return Object.assign(d,licenses[f.f]||{});}

/* ---------- which fonts are visible ---------- */
function pool(){
  if(state.view==='archive')return archived.map(n=>byName[n]||uploaded.find(u=>u.f===n)).filter(Boolean);
  if(state.view.indexOf('board:')===0){const b=state.view.slice(6);return (boards[b]||[]).map(n=>byName[n]||uploaded.find(u=>u.f===n)).filter(Boolean);}
  return [...uploaded,...LF,...FS,...GF].filter(f=>archived.indexOf(f.f)<0);
}
function visibleFonts(){
  const L=LANGS[state.lang],q=state.q.toLowerCase();
  let arr=pool().filter(f=>{
    if(state.cat!=='all'&&f.c!==state.cat&&!f.up)return false;
    if(q&&f.f.toLowerCase().indexOf(q)<0)return false;
    if(state.lang!=='all'&&!f.up&&(!f.s||f.s.indexOf(L.sub)<0))return false;
    if(state.lic!=='all'&&getLic(f).type!==state.lic)return false;
    if(state.src!=='all'){
      const isFs=f.src==='fs',isLf=f.src==='lf',isUp=!!f.up,isGf=!isFs&&!isLf&&!isUp;
      if(state.src==='google'&&!isGf)return false;
      if(state.src==='fontshare'&&!isFs)return false;
      if(state.src==='libre'&&!isLf)return false;
      if(state.src==='uploaded'&&!isUp)return false;
    }
    if(state.favOnly&&!isFav(f.f))return false;
    return true;
  });
  if(state.view==='library'||state.view.indexOf('board:')===0)
    arr.sort((a,b)=>(isFav(b.f)?1:0)-(isFav(a.f)?1:0));
  if(state.random){
    // seeded shuffle so order is stable across re-renders within a session toggle
    let seed=state.randomSeed||1;
    const rng=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  }
  return arr;
}

/* ---------- card ---------- */
function buildSpecs(f){
  const L=LANGS[state.lang],S=state.specs,fam=famOf(f);
  const rtl=L.dir==='rtl'?' rtl':'';
  const it=italOn[f.f]?'font-style:italic;':'';
  const ovr=cardText[f.f]||{};
  const ph=esc(ovr.phrase ?? aPhrase());
  const wd=esc(ovr.word ?? aWord());
  const pa=esc(ovr.para ?? aPara());
  const cap=esc(ovr.caps ?? aPhrase());
  const bl=esc(ovr.black ?? aPhrase());
  const sel=selWeights(f),prim=sel[0];
  const base=`font-family:'${esc(fam)}',sans-serif;${it}`;
  const ed=(spec)=>`contenteditable="plaintext-only" data-card-edit="${esc(f.f)}::${spec}" spellcheck="false"`;
  let b='';
  if(S.phrase) b+=`<div class="spec"><span class="tiny">phrase · click to edit</span>`+
    sel.map(w=>`<div class="big${rtl}" ${ed('phrase')} style="${base}font-weight:${w}">${ph}</div>`).join('')+`</div>`;
  if(S.caps) b+=`<div class="spec"><span class="tiny">caps · click to edit</span>`+
    sel.map(w=>`<div class="big${rtl}" ${ed('caps')} style="${base}font-weight:${w};text-transform:uppercase">${cap}</div>`).join('')+`</div>`;
  if(S.para) b+=`<div class="spec"><span class="tiny">paragraph · click to edit</span><div class="para${rtl}" ${ed('para')} style="${base}font-weight:${prim}">${pa}</div></div>`;
  if(S.single) b+=`<div class="spec"><span class="tiny">single word · caps / lowercase · click to edit</span><div class="words">
      <div class="unit"><div class="big${rtl}" ${ed('word')} style="${base}font-weight:${prim};text-transform:uppercase">${wd}</div></div>
      <div class="unit"><div class="big${rtl}" ${ed('word')} style="${base}font-weight:${prim};text-transform:lowercase">${wd}</div></div></div></div>`;
  if(S.black) b+=`<div class="spec"><span class="tiny">on black · click to edit</span><div class="blackstrip"><div class="big${rtl}" ${ed('black')} style="${base}font-weight:${prim}">${bl}</div></div></div>`;
  return b;
}
function cardInner(f,i){
  const fam=famOf(f);
  const sel=selWeights(f);
  const lic=getLic(f),lm=LICMETA[lic.type];

  let tags=f.up?`<span class="tag up">uploaded</span><span class="tag cat">${f.c}</span>`
    :`<span class="tag cat">${f.c}</span>`+(f.s||[]).map(x=>`<span class="tag">${x}</span>`).join('');
  tags+= (f.w.length===1)?'<span class="tag one" title="single weight – bold is synthesised">1 weight</span>':`<span class="tag">${f.w.length} weights</span>`;

  const opts=['free','rent','paid','unknown'].map(o=>`<option value="${o}"${lic.type===o?' selected':''}>${LICMETA[o].t}</option>`).join('');
  const priceShow=(lic.type==='rent'||lic.type==='paid');
  const searchUrl='https://www.google.com/search?q='+encodeURIComponent(f.f+' font license price');
  const dotStyle=`background:${lm.fill?lm.c:'#fff'};border-color:${lm.c}`;
  const lic_h=`<span class="lic"><span class="lic-dot" style="${dotStyle}"></span>
    <select class="lic-sel" data-licsel="${esc(f.f)}">${opts}</select>
    ${priceShow?`<input type="text" class="price-inp" data-price="${esc(f.f)}" value="${esc(lic.price)}" placeholder="price">`:''}
    ${lic.type!=='free'?`<a class="lic-search" href="${searchUrl}" target="_blank" rel="noopener">price ↗</a>`:''}</span>`;

  const inArch=state.view==='archive';
  const cmpOn=state.compare.indexOf(f.f)>=0;
  const actions=`<button class="act${cmpOn?' on':''}" data-cmp="${esc(f.f)}">${cmpOn?'✓ ':''}compare</button>`+
    `<button class="act" data-insight="${esc(f.f)}">insight</button>`+
    `<button class="act" data-save="${esc(f.f)}">＋ board</button>`+
    (inArch?`<button class="act" data-restore="${esc(f.f)}">restore</button>`
           :`<button class="act" data-arch="${esc(f.f)}">archive</button>`);

  // weight chips
  const wlist=f.w;
  const chips=wlist.map(w=>`<button class="wchip${sel.indexOf(w)>=0?' on':''}" data-w="${w}" data-name="${esc(f.f)}">${w}</button>`).join('')
    + (f.i?`<button class="wchip ital${italOn[f.f]?' on':''}" data-ital="${esc(f.f)}">italic</button>`:'');

  return `<div class="card-head">
      <div class="ch-top">
        <button class="star${isFav(f.f)?' on':''}" data-fav="${esc(f.f)}" title="favourite">${isFav(f.f)?'★':'☆'}</button>
        <span class="fname" style="font-family:'${esc(fam)}',serif">${esc(f.f)}</span>
        <span class="idx">${String(i+1).padStart(3,'0')}</span>
      </div>
      <div class="ch-bot">
        <span class="meta">${tags}${lic_h}</span>
        <span class="actions">${actions}</span>
      </div>
    </div>
    <div class="weights">${chips}</div>
    <div class="specs-wrap">${buildSpecs(f)}</div>
    <div class="insight"></div>`;
}
function makeCardEl(f,i){
  const el=document.createElement('div');
  el.className='card'+(isFav(f.f)?' isfav':'');
  el.dataset.name=f.f;
  el.innerHTML=cardInner(f,i);
  return el;
}
function refreshCard(el,f){
  const i=+(el.dataset.idx||0);
  el.classList.add('refreshing');
  requestAnimationFrame(()=>{
    el.className='card refreshing'+(isFav(f.f)?' isfav':'');
    el.innerHTML=cardInner(f,i);
    loadCardFaces(f);
    requestAnimationFrame(()=>el.classList.remove('refreshing'));
  });
}
function refreshSpecs(card,f){
  /* surgical: rebuild only the .specs-wrap and update weight-chip on-states */
  const wrap=card.querySelector('.specs-wrap');
  if(!wrap){refreshCard(card,f);return;}
  // update weight chip on-states without rebuilding the row
  const sel=selWeights(f);
  card.querySelectorAll('.weights [data-w]').forEach(chip=>{
    chip.classList.toggle('on',sel.indexOf(+chip.dataset.w)>=0);
  });
  const italChip=card.querySelector('.weights [data-ital]');
  if(italChip)italChip.classList.toggle('on',!!italOn[f.f]);
  wrap.classList.add('swapping');
  requestAnimationFrame(()=>{
    wrap.innerHTML=buildSpecs(f);
    loadCardFaces(f);
    requestAnimationFrame(()=>wrap.classList.remove('swapping'));
  });
}

/* ---------- infinite scroll ---------- */
const list=document.getElementById('list');
const PAGE=70; let filtered=[], shown=0;
const faceObs=new IntersectionObserver((ents)=>{
  ents.forEach(e=>{if(e.isIntersecting){const f=byName[e.target.dataset.name]||uploaded.find(u=>u.f===e.target.dataset.name);if(f)loadCardFaces(f);faceObs.unobserve(e.target);}});
},{rootMargin:'1200px'});
function appendMore(){
  const slice=filtered.slice(shown,shown+PAGE);
  slice.forEach((f,k)=>{const el=makeCardEl(f,shown+k);el.dataset.idx=shown+k;list.appendChild(el);faceObs.observe(el);});

    filtered=visibleFonts();shown=0;list.innerHTML='';
    if(!filtered.length){list.innerHTML='<div class="empty">Nothing here yet.<br>Try another script, clear the search, switch view, or upload your own.</div>';}

/* ----- smart upload: parse font metadata via opentype.js, group by family ----- */
const STD_WEIGHTS=[100,200,300,400,500,600,700,800,900];
function pickName(o){if(!o)return null;if(typeof o==='string')return o;return o.en||o['en-US']||Object.values(o)[0]||null;}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function extractFontMeta(font,filename){
  const names=font.names||{};
  const family=pickName(names.preferredFamily)||pickName(names.fontFamily)||filename.replace(/\.(ttf|otf|woff2?)$/i,'');
  const subfamily=pickName(names.preferredSubfamily)||pickName(names.fontSubfamily)||'';
  const os2=font.tables&&font.tables.os2;
  let weight=os2?os2.usWeightClass:400;
  if(weight<=10)weight=weight*100;
  if(weight<100||weight>1000)weight=400;
  weight=STD_WEIGHTS.reduce((p,c)=>Math.abs(c-weight)<Math.abs(p-weight)?c:p);
  const fsSel=os2?os2.fsSelection:0;
  const italic=((fsSel&1)===1)||/italic|oblique/i.test(subfamily);
  let category='sans';
  if(os2&&os2.panose&&os2.panose.length>=2){
    const t=os2.panose[0],s=os2.panose[1];
    if(t===3)category='handwriting';
    else if(t===4)category='display';
    else if(t===2){
      if(s>=2&&s<=10)category='serif';
      else if(s>=11&&s<=15)category='sans';
    }
  }
  if(/mono|code|typewriter/i.test(family))category='mono';
  return{family:family.trim(),weight,italic,category};
}
async function addFontFile(file){
  const url=URL.createObjectURL(file);
  let meta=null;
  try{
    if(window.opentype){
      const buf=await file.arrayBuffer();
      const font=opentype.parse(buf);
      meta=extractFontMeta(font,file.name);
    }
  }catch(err){console.warn('font parse failed:',file.name,err);}
  if(!meta){
    const base=file.name.replace(/\.(ttf|otf|woff2?)$/i,'');
    meta={family:base,weight:400,italic:false,category:'sans'};
  }
  // find or create family entry
  let obj=uploaded.find(u=>u.f===meta.family);
  if(!obj){
    const fam='up_'+(upId++)+'_'+slug(meta.family);
    obj={f:meta.family,fam:fam,c:meta.category,s:[],w:[],i:0,up:1};
    uploaded.unshift(obj);
    byName[meta.family]=obj;
  }
  // add weight if new (italic faces don't count toward the weight list visibly, but we register them)
  if(!meta.italic&&!obj.w.includes(meta.weight))obj.w.push(meta.weight);
  if(!obj.w.length)obj.w.push(meta.weight); // fallback if all uploads are italic
  obj.w.sort((a,b)=>a-b);
  if(meta.italic)obj.i=1;
  // register the FontFace under the family's fam name with proper descriptors
  try{
    const ff=new FontFace(obj.fam,'url('+url+')',{
      weight:String(meta.weight),
      style:meta.italic?'italic':'normal'
    });
    const loaded=await ff.load();
    document.fonts.add(loaded);
  }catch(err){console.warn('FontFace load failed:',file.name,err);return false;}
  return true;
}
fi.onchange=async e=>{for(const f of e.target.files)await addFontFile(f);applyFilter();fi.value='';};

/* ---------- font analysis (client-side, offline) ---------- */
function measureFont(fam,w){
  const cv=document.createElement('canvas');cv.width=460;cv.height=340;
  const ctx=cv.getContext('2d');ctx.textBaseline='alphabetic';
  function scan(ch,px){
    ctx.clearRect(0,0,cv.width,cv.height);ctx.font=w+' '+px+'px "'+fam+'"';ctx.fillStyle='#000';ctx.fillText(ch,40,250);
    const d=ctx.getImageData(0,0,cv.width,cv.height).data;let minX=1e9,maxX=-1,minY=1e9,maxY=-1,n=0;
    for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++){if(d[(y*cv.width+x)*4+3]>110){n++;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}}
    return {minX,maxX,minY,maxY,w:maxX-minX,h:maxY-minY,count:n,data:d,W:cv.width};
  }
  const H=scan('H',200),X=scan('x',200),N=scan('n',200),O=scan('O',220);
  const capH=H.h||1,xH=X.h||1;
  const xratio=xH/capH;
  const widthRatio=(N.w||1)/capH;
  const darkness=N.count/((N.w*N.h)||1);
  // contrast from O: side (vertical) stroke vs top (horizontal) stroke
  let side=0,top=0;
  if(O.h>0&&O.w>0){
    const midY=Math.round(O.minY+O.h/2),midX=Math.round(O.minX+O.w/2),d=O.data,W=O.W;
    for(let x=O.minX;x<=O.maxX;x++){if(d[(midY*W+x)*4+3]>110)side++;else if(side>0)break;}
    for(let y=O.minY;y<=O.maxY;y++){if(d[(y*W+midX)*4+3]>110)top++;else if(top>0)break;}
  }
  const contrast=top>0?side/top:1;
  return {xratio,widthRatio,darkness,contrast,capH};
}
async function analyzeFont(f,container){
  const fam=famOf(f),w=selWeights(f)[0];
  container.innerHTML='<span class="ins-busy">reading the outlines…</span>';container.classList.add('show');
  ensureFace(f,w,false);
  try{await document.fonts.load(w+' 200px "'+fam+'"','HxnoOg');}catch(e){}
  await new Promise(r=>setTimeout(r,70));
  let m;try{m=measureFont(fam,w);}catch(e){m=null;}
  if(!m||!m.capH||m.capH<2){container.innerHTML='<span class="ins-busy">couldn’t read this font’s outlines — try again once it’s loaded.</span>';return;}
  container.innerHTML=renderInsight(m,f);
}
function renderInsight(m,f){
  const pct=x=>Math.round(x*100)+'%';
  const metrics=`<div class="ins-grid">
    <span class="ins-metric">x-height<b>${pct(m.xratio)}</b></span>
    <span class="ins-metric">stroke contrast<b>${m.contrast.toFixed(1)}:1</b></span>
    <span class="ins-metric">set width<b>${m.widthRatio.toFixed(2)}</b></span>
    <span class="ins-metric">text colour<b>${pct(m.darkness)}</b></span>
    <span class="ins-metric">weights<b>${f.up?'—':f.w.length}</b></span>
  </div>`;
  const F=[];
  if(m.xratio>=0.72)F.push(`<b>Tall x-height</b> <i>(${pct(m.xratio)})</i> — lowercase runs large, so it stays legible at small sizes and on screens.`);
  else if(m.xratio<=0.62)F.push(`<b>Short x-height</b> <i>(${pct(m.xratio)})</i> — classical proportions with generous space above the waistline; elegant, but set it larger for body text.`);
  else F.push(`<b>Balanced x-height</b> <i>(${pct(m.xratio)})</i> — versatile across display and text sizes.`);
  if(m.contrast>=2.2)F.push(`<b>High stroke contrast</b> <i>(${m.contrast.toFixed(1)}:1)</i> — dramatic thick-to-thin modulation; an editorial, high-fashion voice that shines at large sizes.`);
  else if(m.contrast<=1.22)F.push(`<b>Near-monolinear strokes</b> — almost no thick/thin variation, giving an even, geometric, modern colour.`);
  else F.push(`<b>Moderate contrast</b> <i>(${m.contrast.toFixed(1)}:1)</i> — a humanist modulation that reads naturally in running text.`);
  if(m.widthRatio<=0.6)F.push(`<b>Condensed</b> — narrow set width that packs tightly; efficient for headlines and tight columns.`);
  else if(m.widthRatio>=0.92)F.push(`<b>Wide & open</b> — relaxed, generous set width with an airy rhythm.`);
  if(m.darkness>=0.34)F.push(`<b>Dark colour</b> on the page — sets a heavy, assertive block of text.`);
  else if(m.darkness<=0.2)F.push(`<b>Light, airy colour</b> — delicate on the page, wants a touch more weight or size for body copy.`);
  if(!f.up){
    if(f.c==='mono')F.push(`<b>Monospaced</b> — every glyph shares one advance width; ideal for code and tabular figures.`);
    else if(f.c==='handwriting')F.push(`<b>Script / handwriting</b> — informal and expressive; best in short bursts, not paragraphs.`);
    else if(f.c==='display')F.push(`<b>Display face</b> — engineered for headlines and big sizes rather than long text.`);
    if(f.w.length>=8)F.push(`<b>Broad weight range</b> <i>(${f.w.length} weights)</i> — a full system for building hierarchy in one family.`);
    else if(f.w.length===1)F.push(`<b>Single weight</b> — no real bold cut; pair it with another face for contrast.`);
    F.push(f.i?`<b>True italic</b> available.`:`<b>No italic</b> — upright only.`);
  }
  return metrics+'<ul class="ins-feats">'+F.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
}

/* ---------- cloud sync ---------- */
function gatherState(){return {favs:favorites,lic:licenses,arch:archived,boards:boards,_t:Date.now()};}
function applyState(o){
  if(!o||typeof o!=='object')return;
  suppressSync=true;
  if(Array.isArray(o.favs))favorites=o.favs;
  if(o.lic&&typeof o.lic==='object')licenses=o.lic;
  if(Array.isArray(o.arch))archived=o.arch;
  if(o.boards&&typeof o.boards==='object')boards=o.boards;
  store.set('tl_favs',favorites);store.set('tl_lic',licenses);store.set('tl_arch',archived);store.set('tl_boards',boards);
  suppressSync=false;
  renderBoardPills();applyFilter();
}
async function cloudSave(){
  const c=syncCfg;if(!c||c.provider==='off')return;setSyncStatus('saving…');
  const body=JSON.stringify(gatherState());
  try{
    if(c.provider==='jsonbin'){
      if(!c.bin||!c.key){setSyncStatus('need key + bin');return;}
      await fetch('https://api.jsonbin.io/v3/b/'+c.bin,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':c.key},body});
    }else if(c.provider==='custom'){
      if(!c.url){setSyncStatus('need URL');return;}
      const h={'Content-Type':'application/json'};if(c.token)h['Authorization']='Bearer '+c.token;
      await fetch(c.url,{method:'PUT',headers:h,body});
    }
    setSyncStatus('saved · '+new Date().toLocaleTimeString());
  }catch(e){setSyncStatus('save failed — check settings / CORS');}
}
async function cloudLoad(){
  const c=syncCfg;if(!c||c.provider==='off')return;setSyncStatus('loading…');
  try{
    let obj;
    if(c.provider==='jsonbin'){
      if(!c.bin||!c.key){setSyncStatus('need key + bin');return;}
      const r=await fetch('https://api.jsonbin.io/v3/b/'+c.bin+'/latest',{headers:{'X-Master-Key':c.key}});
      const j=await r.json();obj=j.record;
    }else if(c.provider==='custom'){
      if(!c.url){setSyncStatus('need URL');return;}
      const h={};if(c.token)h['Authorization']='Bearer '+c.token;
      const r=await fetch(c.url,{headers:h});obj=await r.json();
    }
    applyState(obj);setSyncStatus('loaded · '+new Date().toLocaleTimeString());
  }catch(e){setSyncStatus('load failed — check settings / CORS');}
}
async function jsonbinCreate(key){
  try{const r=await fetch('https://api.jsonbin.io/v3/b',{method:'POST',headers:{'Content-Type':'application/json','X-Master-Key':key,'X-Bin-Name':'type-lab','X-Bin-Private':'true'},body:JSON.stringify(gatherState())});const j=await r.json();return j.metadata&&j.metadata.id;}catch(e){return null;}
}
function setSyncStatus(m){const s=document.getElementById('spstatus');if(s)s.textContent=m;}
function persistCfg(){store.set('tl_sync',syncCfg);const b=document.getElementById('syncbtn');if(b)b.classList.toggle('on',syncCfg.provider!=='off');}
function bindSyncFields(){
  const g=id=>document.getElementById(id);
  if(g('jbkey'))g('jbkey').oninput=e=>{syncCfg.key=e.target.value.trim();persistCfg();};
  if(g('jbbin'))g('jbbin').oninput=e=>{syncCfg.bin=e.target.value.trim();persistCfg();};
  if(g('cuurl'))g('cuurl').oninput=e=>{syncCfg.url=e.target.value.trim();persistCfg();};
  if(g('cutok'))g('cutok').oninput=e=>{syncCfg.token=e.target.value.trim();persistCfg();};
  if(g('jbcreate'))g('jbcreate').onclick=async()=>{if(!syncCfg.key){setSyncStatus('enter master key first');return;}setSyncStatus('creating bin…');const id=await jsonbinCreate(syncCfg.key);if(id){syncCfg.bin=id;persistCfg();g('jbbin').value=id;setSyncStatus('bin created — now Save now');}else setSyncStatus('create failed — check key');};
  if(g('dosave'))g('dosave').onclick=cloudSave;
  if(g('doload'))g('doload').onclick=cloudLoad;
}
function renderSyncFields(){
  const c=syncCfg,f=document.getElementById('spfields'),row=document.getElementById('sprow');
  if(c.provider==='jsonbin'){
    f.innerHTML=`<label>Master key</label><input id="jbkey" value="${esc(c.key||'')}" placeholder="X-Master-Key from jsonbin.io">
      <label>Bin id — or create one →</label><input id="jbbin" value="${esc(c.bin||'')}" placeholder="bin id">`;
    row.innerHTML='<button id="jbcreate">Create bin</button><button id="dosave" class="solid">Save now</button><button id="doload">Load now</button>';
  }else if(c.provider==='custom'){
    f.innerHTML=`<label>Endpoint URL (GET returns JSON · PUT saves JSON)</label><input id="cuurl" value="${esc(c.url||'')}" placeholder="https://your-endpoint">
      <label>Bearer token — optional</label><input id="cutok" value="${esc(c.token||'')}" placeholder="token">`;
    row.innerHTML='<button id="dosave" class="solid">Save now</button><button id="doload">Load now</button>';
  }else{f.innerHTML='';row.innerHTML='';}
  persistCfg();bindSyncFields();
}
function openSync(){
  const c=syncCfg,sv=document.getElementById('syncview');
  sv.innerHTML=`<div class="sync-card"><button class="sync-close" id="syncclose">✕</button>
    <h3>Cloud memory</h3>
    <p class="note">Already saved on this device. To remember across devices, sync favourites, boards, archive &amp; licence notes to a free store. Easiest: make an account at <a href="https://jsonbin.io" target="_blank" rel="noopener">jsonbin.io</a>, copy your Master Key, pick JSONBin below, press <b>Create bin</b>, then <b>Save now</b>. On another device, enter the same key + bin id and press <b>Load now</b>.</p>
    <label>Provider</label>
    <select id="sp">
      <option value="off"${c.provider==='off'?' selected':''}>Off — this device only</option>
      <option value="jsonbin"${c.provider==='jsonbin'?' selected':''}>JSONBin — free, no server</option>
      <option value="custom"${c.provider==='custom'?' selected':''}>Custom endpoint — GET/PUT JSON</option>
    </select>
    <div id="spfields"></div><div class="sync-row" id="sprow"></div><div class="sync-status" id="spstatus"></div></div>`;
  sv.classList.add('show');renderSyncFields();
  document.getElementById('sp').onchange=e=>{const p=e.target.value;syncCfg=Object.assign({},syncCfg,{provider:p});renderSyncFields();};
}
document.getElementById('syncbtn').onclick=openSync;
document.addEventListener('click',e=>{
  if(e.target.id==='syncclose'||e.target.id==='syncview')document.getElementById('syncview').classList.remove('show');
});

/* ---------- go ---------- */
persistCfg();
updateCmpBar();
renderBoardPills();
applyFilter();
if(syncCfg.provider!=='off')cloudLoad();
</script>
</body>
